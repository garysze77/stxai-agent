version: 2

builds:
  - id: stxai
    main: ./cmd/stxai
    binary: stxai
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/garysze77/stxai-agent/internal/commands.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    builds: [stxai]
    name_template: "stxai_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: install.sh
        dst: .

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
