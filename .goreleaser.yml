# GoReleaser config for the STX AI Agent client.
# Documentation: https://goreleaser.com
version: 2

builds:
  - id: stxai
    dir: agent
    main: .
    binary: stxai
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    builds: [stxai]
    name_template: "stxai_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: agent/README.md
        dst: .
      - src: agent/install.sh
        dst: .

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

